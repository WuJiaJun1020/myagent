<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Pi Desktop</title>
    <script>
      (() => {
        let preference = "dark";
        try {
          const persisted = JSON.parse(localStorage.getItem("pi-desktop-settings") || "null");
          const storedTheme = persisted?.state?.theme;
          if (storedTheme === "light" || storedTheme === "dark" || storedTheme === "system") {
            preference = storedTheme;
          }
        } catch {
          // Invalid persisted settings fall back to the default dark theme.
        }
        const resolved = preference === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : preference;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; cursor: default; background: #0d1118; }
      html[data-theme="light"], html[data-theme="light"] body, html[data-theme="light"] #root { background: #f4f6f9; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
